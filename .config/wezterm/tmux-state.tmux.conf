# Signal WezTerm immediately when a tmux client attaches or detaches.
set-hook -g client-attached[987] 'run-shell "$HOME/.config/wezterm/tmux-state.sh 1 --all-clients"'
set-hook -g client-session-changed[987] 'run-shell "$HOME/.config/wezterm/tmux-state.sh 1 --all-clients"'
set-hook -g client-detached[987] 'run-shell "$HOME/.config/wezterm/tmux-state.sh 0 #{client_tty}"'
